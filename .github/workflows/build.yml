name: Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Feature branches (e.g. the cross-repo `signin` branch): tests and an
  # image build, never a push. On main it publishes `edge` like a push: the
  # Dependabot auto-merge job dispatches it after a merge (a GITHUB_TOKEN
  # merge starts no push run). Dispatching on main needs write access, the
  # same trust as pushing to main.
  workflow_dispatch:
    inputs:
      # The Hub and core branch both compare steps (vectors, smoke realm)
      # follow. Empty: this run's branch (the same-named branch when it
      # exists, else main), like a push. Set: exactly that branch, which
      # must exist on both. A cross-repo feature merged here before the Hub
      # and core: dispatch on main with compare_ref=<the feature branch> so
      # the run publishes `edge` (CLAUDE.md, "Merge order").
      compare_ref:
        description: Hub/core branch to compare against (empty = this run's branch, else main)
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR and main builds are cancelled (the newest main build
  # publishes edge anyway); tag builds have their own ref and always finish.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Gradle `test` with --dependency-verification strict, in the Dockerfile's
  # test stage (the pinned Gradle image).
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The extension compiles against the Keycloak artifacts of
      # build.gradle.kts `val keycloak`; the image must run that Keycloak.
      - name: Keycloak versions agree (Dockerfile, build.gradle.kts)
        run: |
          image=$(sed -nE 's|^FROM quay\.io/keycloak/keycloak:([^@[:space:]]+)@sha256:[0-9a-f]{64}$|\1|p' Dockerfile)
          gradle=$(sed -nE 's|^val keycloak = "([^"]+)".*$|\1|p' build.gradle.kts)
          echo "Dockerfile: ${image:-?}  build.gradle.kts: ${gradle:-?}"
          if [ -z "$image" ] || [ -z "$gradle" ] || [ "$(grep -c '^FROM quay\.io/keycloak/keycloak:' Dockerfile)" != 1 ] || [ "$image" != "$gradle" ]; then
            echo "::error::the Dockerfile's Keycloak tag (${image:-none}) must equal build.gradle.kts val keycloak (${gradle:-none}); bump both together"
            exit 1
          fi

      - name: Gradle test (docker buildx build --target test)
        run: docker buildx build --progress=plain --target test .

      # .github/automerge/automerge.sh (Dependabot auto-merge): fake gh +
      # fixtures, no network.
      - name: Dependabot auto-merge tests
        run: |
          shellcheck -S warning .github/automerge/*.sh .github/compare-ref.sh
          bash .github/automerge/test.sh

  # The shared rule vectors (contract §8.1): src/test/resources/
  # signin_vectors.json is a byte copy of portcullis-hub's
  # internal/signin/testdata/vectors.json on the same-named branch when it
  # exists (cross-repo feature branches land together), else main; a
  # dispatched run's `compare_ref` names the branch instead (both compare
  # steps, .github/compare-ref.sh). When the
  # Hub ref has no such file yet, or this repo has no copy yet (the
  # scaffolding-only main), it prints a notice and passes.
  vectors:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare with the Hub's vectors
        env:
          REF: ${{ github.head_ref || github.ref_name }}
          COMPARE_REF: ${{ inputs.compare_ref }}
        run: |
          own=src/test/resources/signin_vectors.json
          if [ ! -f "$own" ]; then
            echo "::notice::$own isn't in this ref yet: nothing to compare"
            exit 0
          fi
          url="https://github.com/porelli/portcullis-hub"
          . .github/compare-ref.sh
          echo "portcullis-hub: $ref" | tee -a "$GITHUB_STEP_SUMMARY"
          hub="$RUNNER_TEMP/hub_vectors.json"
          code=$(curl -sS -o "$hub" -w '%{http_code}' "https://raw.githubusercontent.com/porelli/portcullis-hub/$ref/internal/signin/testdata/vectors.json")
          case "$code" in
            200) ;;
            404)
              echo "::notice::portcullis-hub $ref has no internal/signin/testdata/vectors.json yet: nothing to compare"
              exit 0 ;;
            *)
              echo "::error::fetching the Hub's vectors from $ref: HTTP $code"
              exit 1 ;;
          esac
          if ! cmp "$own" "$hub"; then
            echo "::error::$own differs from portcullis-hub $ref internal/signin/testdata/vectors.json: copy it byte for byte"
            exit 1
          fi
          echo "vectors match portcullis-hub $ref" | tee -a "$GITHUB_STEP_SUMMARY"

      # src/test/resources/smoke-realm.json follows core's realm-export.json
      # (the flows, their configs, the browser flow binding, the required
      # actions, the passwordless WebAuthn policy) on the same-named core
      # branch when it exists, else main; a ref without the file passes with
      # a notice.
      - name: Compare the smoke realm with core's flows
        env:
          REF: ${{ github.head_ref || github.ref_name }}
          COMPARE_REF: ${{ inputs.compare_ref }}
        run: |
          url="https://github.com/porelli/portcullis"
          . .github/compare-ref.sh
          echo "portcullis: $ref" | tee -a "$GITHUB_STEP_SUMMARY"
          core="$RUNNER_TEMP/realm-export.json"
          code=$(curl -sS -o "$core" -w '%{http_code}' "https://raw.githubusercontent.com/porelli/portcullis/$ref/keycloak/realm-export.json")
          case "$code" in
            200) ;;
            404) echo "::notice::portcullis $ref has no keycloak/realm-export.json: nothing to compare"; exit 0 ;;
            *) echo "::error::fetching core's realm-export from $ref: HTTP $code"; exit 1 ;;
          esac
          keys='{authenticationFlows, authenticatorConfig, browserFlow, requiredActions, bruteForceProtected, failureFactor} + (with_entries(select(.key | startswith("webAuthnPolicyPasswordless"))))'
          if ! jq -e '.authenticationFlows | map(.alias) | index("portcullis-signin")' "$core" >/dev/null; then
            echo "::notice::portcullis $ref's realm has no portcullis-signin flow yet: nothing to compare"
            exit 0
          fi
          if ! diff <(jq -S "$keys" "$core") <(jq -S "$keys" src/test/resources/smoke-realm.json); then
            echo "::error::src/test/resources/smoke-realm.json doesn't follow portcullis $ref keycloak/realm-export.json (flows, configs, required actions, passwordless policy): copy them"
            exit 1
          fi
          echo "smoke realm follows portcullis $ref" | tee -a "$GITHUB_STEP_SUMMARY"

  # Build, smoke run and the multi-platform build: no write permission.
  smoke:
    needs: [test, vectors]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Contract §8.1 / plan D5: every provider id the extension ships so far
      # (space separated). The smoke run checks Keycloak lists each one.
      PROVIDER_IDS: "webauthn-register-passwordless webauthn-register portcullis-security-key portcullis-device-passkey portcullis-passkey-store portcullis-reclassify portcullis-passkey portcullis-condition-passkey-kind portcullis-method portcullis-password-form portcullis-x509 portcullis-fresh auth-cookie portcullis-template portcullis-impersonate portcullis-impersonation portcullis-impersonation-expiry"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The runner's platform only, loaded into the local daemon for the
      # smoke run.
      - name: Build for the smoke run
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: portcullis-keycloak:smoke
          cache-from: type=gha,scope=image-main

      # start-dev with a throwaway admin, then GET /admin/serverinfo: every
      # id of PROVIDER_IDS must be listed. The admin password is random and
      # never on argv: docker gets it from the environment (-e NAME), curl
      # from a 0600 file.
      - name: Smoke run (start-dev, admin serverinfo)
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          KC_BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 24)
          export KC_BOOTSTRAP_ADMIN_PASSWORD KC_BOOTSTRAP_ADMIN_USERNAME=smoke
          printf 'grant_type=password&client_id=admin-cli&username=smoke&password=%s' "$KC_BOOTSTRAP_ADMIN_PASSWORD" > "$work/token-form"
          cid=$(docker create --name kc-smoke -p 127.0.0.1:8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME -e KC_BOOTSTRAP_ADMIN_PASSWORD \
            portcullis-keycloak:smoke start-dev)
          docker cp "$cid:/opt/keycloak/providers/portcullis-signin.jar" "$work/" >/dev/null
          echo "jar in the image: $(stat -c %s "$work/portcullis-signin.jar") bytes"
          docker start kc-smoke >/dev/null
          token=""
          for _ in $(seq 1 90); do
            if token=$(curl -fsS --data-binary "@$work/token-form" \
                 -H 'Content-Type: application/x-www-form-urlencoded' \
                 http://127.0.0.1:8080/realms/master/protocol/openid-connect/token 2>/dev/null | jq -r .access_token) \
               && [ -n "$token" ] && [ "$token" != null ]; then break; fi
            token=""
            sleep 2
          done
          if [ -z "$token" ]; then
            docker logs kc-smoke 2>&1 | tail -100
            echo "::error::Keycloak didn't answer the token endpoint"
            exit 1
          fi
          printf 'Authorization: Bearer %s\n' "$token" > "$work/auth-header"
          curl -fsS -H "@$work/auth-header" http://127.0.0.1:8080/admin/serverinfo > "$work/serverinfo.json"
          jq -r '[.providers[].providers | keys[]] | .[]' "$work/serverinfo.json" | sort -u > "$work/ids"
          echo "Keycloak lists $(wc -l < "$work/ids") provider ids"
          missing=0
          for id in $PROVIDER_IDS; do
            if grep -qxF "$id" "$work/ids"; then echo "ok  $id"; else echo "::error::provider $id isn't listed"; missing=1; fi
          done
          # The overrides are the ones in use, not the stock factories of
          # the same id (both are listed either way).
          for id in webauthn-register-passwordless webauthn-register; do
            marker=$(jq -r --arg id "$id" '.providers["required-action"].providers[$id].operationalInfo.portcullis // ""' "$work/serverinfo.json")
            order=$(jq -r --arg id "$id" '.providers["required-action"].providers[$id].order // 0' "$work/serverinfo.json")
            if [ "$marker" = passkey-kinds ] && [ "$order" = 1 ]; then echo "ok  $id is the Portcullis override"; else echo "::error::required action $id isn't the Portcullis override (marker '$marker', order $order)"; missing=1; fi
          done
          marker=$(jq -r '.providers["authenticator"].providers["auth-cookie"].operationalInfo.portcullis // ""' "$work/serverinfo.json")
          order=$(jq -r '.providers["authenticator"].providers["auth-cookie"].order // 0' "$work/serverinfo.json")
          if [ "$marker" = pc-method ] && [ "$order" = 1 ]; then echo "ok  auth-cookie is the Portcullis override"; else echo "::error::authenticator auth-cookie isn't the Portcullis override (marker '$marker', order $order)"; missing=1; fi
          # portcullis-fresh is a protocol mapper (Keycloak lists it under protocol-mapper).
          for id in portcullis-fresh portcullis-impersonation; do
            if jq -e --arg id "$id" '.providers["protocol-mapper"].providers[$id]' "$work/serverinfo.json" >/dev/null; then echo "ok  $id is a protocol mapper"; else echo "::error::$id isn't listed as a protocol mapper"; missing=1; fi
          done
          if jq -e '.providers["realm-restapi-extension"].providers["portcullis-impersonate"]' "$work/serverinfo.json" >/dev/null; then echo "ok  portcullis-impersonate is a realm resource"; else echo "::error::portcullis-impersonate isn't listed as a realm resource"; missing=1; fi
          if docker logs kc-smoke 2>&1 | grep -iE 'portcullis.*(ERROR|Exception)|(ERROR|Exception).*portcullis'; then
            echo "::error::Keycloak logged an error naming portcullis"
            missing=1
          fi
          docker rm -f kc-smoke >/dev/null
          rm -rf "$work"
          exit "$missing"

      # A live sign-in on a realm built from core's flow tree
      # (src/test/resources/smoke-realm.json; the vectors job checks it
      # against core's realm-export): password on and off, the passkey
      # sign-in page first, a real discoverable assertion through a CDP
      # virtual authenticator, pc_method=password, and the debug log never
      # invoking the password form while password is off.
      - name: Install Playwright (pinned)
        run: |
          python3 -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --quiet -r .github/smoke/requirements.txt
          sudo /tmp/smoke-venv/bin/playwright install-deps chromium
          /tmp/smoke-venv/bin/playwright install chromium

      - name: Live sign-in smoke run (core's flow tree, virtual authenticator)
        env:
          IMAGE: portcullis-keycloak:smoke
          PYTHON: /tmp/smoke-venv/bin/python
        run: bash .github/smoke/run.sh

      # The mtls amr invariant (contract §8, §8.1 "Flows"): a test internal
      # CA made with openssl (a YubiKey CA and a browser CA under one root,
      # their CRLs served as http://vault:8200/v1/pki_{int,file}/crl),
      # Keycloak with core's x509 options (traefik lookup, proxy headers,
      # truststore directory, CRL cache time); each leaf posted in Traefik's
      # header: the YubiKey leaf's amr has mtls and never file, the browser
      # leaf's file and never mtls; a switched-off kind doesn't sign in; the
      # LOGIN events carry the history details; no error naming portcullis.
      - name: x509 kinds
        env:
          IMAGE: portcullis-keycloak:smoke
          PYTHON: /tmp/smoke-venv/bin/python
        run: bash .github/smoke/run.sh x509

      # Signing in as someone else (contract §8.1 "Impersonation"): Keycloak
      # with --features-disabled=impersonation (as core); the admin API
      # makes lldap_admin, root (in it) and alice; root signs in with a
      # password; impersonation.json bound to root's session; the start with
      # root's cookies (302 to oauth2/start); the token for smoke is alice's
      # with act.sub root, pc_imp.id and root's amr + hwk; root's session
      # gone; a second start 403; the guard (an unlisted client, pc_method,
      # prompt=login, max_age, acr refused; an ended record → the ended page
      # and the session logged out); the expiry task logs out an ended and an
      # unreadable-file session within 50 s; Keycloak's own impersonation refused; the
      # IMPERSONATE event with pc_imp / pc_act; no portcullis ERROR and never
      # the reason in the log.
      - name: impersonation
        env:
          IMAGE: portcullis-keycloak:smoke
          PYTHON: /tmp/smoke-venv/bin/python
        run: bash .github/smoke/run.sh impersonation

      # Both platforms, never pushed: every run checks the arm64 image
      # builds. Main's publishing runs write the layer cache (mode=max:
      # every stage, both platforms, one content-addressed scope) that
      # publish reads; PRs, branches and tags only read it.
      - name: Multi-platform build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=image-main
          cache-to: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && 'type=gha,scope=image-main,mode=max' || '' }}

  # The only job that can write packages or sign: pushes (main → edge, v*
  # tags) and dispatched runs on main (the auto-merge job, after a
  # Dependabot merge) publish; PRs and dispatched feature-branch runs stop
  # after smoke.
  publish:
    needs: smoke
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signing (GitHub OIDC)
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Contract §1: X.Y.Z, X.Y, X and sha-<short> for v* tags; edge for main;
      # never latest.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image-main

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Sign the pushed manifest-list digest (covers every tag and platform).
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
